name: Deploy - Staging & Production

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '20'

jobs:
  # ===== BUILD & PUSH DOCKER IMAGES =====
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      image-digest: ${{ steps.build-backend.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-backend:buildcache,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-frontend:buildcache,mode=max

  # ===== DEPLOY TO STAGING =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.ebdesign.local

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to Staging Environment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend Image:  ${{ needs.build-images.outputs.backend-image }}"
          echo "Frontend Image: ${{ needs.build-images.outputs.frontend-image }}"
          echo ""
          echo "Environment Variables:"
          echo "  - ENVIRONMENT: staging"
          echo "  - API_URL: https://api.staging.ebdesign.local"
          echo "  - UI_URL: https://staging.ebdesign.local"
          echo ""
          echo "ℹ️  Add your deployment script here"
          echo "   Examples:"
          echo "   - docker-compose pull && docker-compose up -d"
          echo "   - kubectl set image deployment/backend backend=<image>"
          echo "   - Deploy via Railway, Heroku, AWS, etc."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Health Check - Staging
        run: |
          echo "🏥 Running health checks..."
          # Add your health check command here
          # Example: curl -f https://staging.ebdesign.local/health
          echo "✅ Health check passed (placeholder)"

      - name: Smoke Tests - Staging
        run: |
          echo "🧪 Running smoke tests..."
          # Add your smoke test command here
          # Example: npm run test:smoke
          echo "✅ Smoke tests passed (placeholder)"

  # ===== DEPLOY TO PRODUCTION =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://ebdesign.local

    steps:
      - uses: actions/checkout@v4

      - name: Pre-Deployment Checks
        run: |
          echo "🔍 Running pre-deployment checks..."
          echo "✅ Verifying deployment readiness"

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to Production Environment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend Image:  ${{ needs.build-images.outputs.backend-image }}"
          echo "Frontend Image: ${{ needs.build-images.outputs.frontend-image }}"
          echo ""
          echo "Environment Variables:"
          echo "  - ENVIRONMENT: production"
          echo "  - API_URL: https://api.ebdesign.local"
          echo "  - UI_URL: https://ebdesign.local"
          echo ""
          echo "ℹ️  Add your deployment script here"
          echo "   Examples:"
          echo "   - docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d"
          echo "   - kubectl set image deployment/backend backend=<image>"
          echo "   - Deploy via Railway, Heroku, AWS, etc."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Health Check - Production
        run: |
          echo "🏥 Running health checks..."
          # Add your health check command here
          for i in {1..30}; do
            echo "Attempt $i/30: Checking service health..."
            sleep 5
          done
          echo "✅ Health check passed (placeholder)"

      - name: Smoke Tests - Production
        run: |
          echo "🧪 Running smoke tests..."
          # Add your smoke test command here
          echo "✅ Smoke tests passed (placeholder)"

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "✅ Deployment Successful!"
          echo "🎉 EBDESIGN is now live in production"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment Failed!"
          echo "🔴 Rolling back to previous version"

  # ===== POST-DEPLOYMENT NOTIFICATION =====
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Build Status:         ${{ needs.build-images.result }}"
          echo "Staging Deploy:       ${{ needs.deploy-staging.result }}"
          echo "Production Deploy:    ${{ needs.deploy-production.result }}"
          echo ""
          echo "Commit:               ${{ github.sha }}"
          echo "Branch:               ${{ github.ref }}"
          echo "Author:               ${{ github.actor }}"
          echo ""
          echo "Backend Image:        ${{ needs.build-images.outputs.backend-image }}"
          echo "Frontend Image:       ${{ needs.build-images.outputs.frontend-image }}"
          echo ""
          echo "Timestamp:            $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send Slack Notification
        if: always()
        run: |
          echo "📢 Sending Slack notification..."
          echo "To: #deployments channel"
          echo "Status: ${{ needs.deploy-production.result }}"
          echo ""
          echo "ℹ️  Add Slack webhook secret to enable notifications:"
          echo "   GitHub → Settings → Secrets → SLACK_WEBHOOK"

      - name: Create Deployment Record
        uses: actions/github-script@v7
        with:
          script: |
            console.log('📝 Creating deployment record...');
            console.log('Status: Deployment completed');
            console.log('Branch: ${{ github.ref }}');
